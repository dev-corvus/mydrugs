    <link rel="icon" href="./assets/icons/mydrugs-favicon.ico">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <nav class="mobile-menu-nav">
            <a href="index.html" class="mobile-logo" aria-label="MyDrugs home">
                <img src="./assets/icons/mydrugs-logo-nobg.png" alt="">
            </a>
            <ul id="menu" class="menu">
                <li><a href="shop.html">SHOP</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li class="desktop-logo">
                    <a href="index.html" class="logo">
                        <img src="./assets/icons/mydrugs-logo-nobg.png" alt="MyDrugs Logo">
                    </a>
                </li>
                <li><a href="safety.html">SAFETY</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>

            <button type="button" id="menu-toggle" aria-label="open menu" aria-expanded="false" aria-controls="menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M21 5.5H3V7h18V5.5Zm0 5.75H3v1.5h18v-1.5ZM3 17h18v1.5H3V17Z" fill="currentColor" />
                </svg>
            </button>
        </nav>
    </header>
    <main>
        <section class="contact-container">
            <article class="first-contact">
                <div class="contact-section">
                    <h1>Contact Us</h1>
                    <p>If you have any questions or concerns, feel free to reach out to us!</p>
                </div>

                <form>
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="XKira7gaming" required>

                    <label for="subject">Subject:</label>
                    <textarea id="subject" name="subject" rows="1" placeholder="bla" required></textarea>

                    <label for="topic-select">Choose a topic:</label>
                    <select id="topic-select">
                        <option value="">--Please choose an option--</option>
                        <option value="">Product</option>
                        <option value="">Delivery</option>
                        <option value="">Question</option>
                        <option value="">Website</option>
                    </select>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="blablabla..." required></textarea>
                </form>
            </article>

            <article class="second-contact">
                <div class="contact-section">
                    <h1>Tell us who you really are</h1>
                    <p>We will sell your data to third parties</p>
                </div>

                <form>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="XKira7 gaming official" required>

                    <label for="email">Email Address:</label>
                    <input type ="email" id="email" name="email" placeholder="kira7gaming@email.com" required>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="cop" name="cop">
                        <label for="cop">Are you a cop?</label>
                    </div>

                    <button type="submit" class="contact-button">Submit</button>
                </form>
            </article>
        </section> 
    </main>

    <footer>&copy; Build: v2.4.1-stable | Server Time: UTC 16:15:32 </footer>
    <script src="main.js"></script>
</body>
</html>
